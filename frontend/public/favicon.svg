<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="xk-fav-primary" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="xk-fav-top" x1="54" y1="8" x2="30" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="xk-fav-bot" x1="34" y1="30" x2="10" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <!-- Pitch Midnight Violet Background -->
  <rect width="64" height="64" fill="#08070e" />

  <!-- Primary Diagonal Band (Top-Left to Bottom-Right) -->
  <polygon points="10,8 24,8 54,56 40,56" fill="url(#xk-fav-primary)" />

  <!-- Crossing Top-Right Segment -->
  <polygon points="54,8 40,8 29,26 38,32" fill="url(#xk-fav-top)" />

  <!-- Crossing Bottom-Left Segment -->
  <polygon points="26,32 35,38 24,56 10,56" fill="url(#xk-fav-bot)" />
</svg>
